name: flowsync
description: >
  FlowSync — one calendar, one schedule, one todo list. Tracks habits and
  rewards you for keeping them, tracks your budget, and uses a local Ollama
  model to suggest changes you can accept or deny.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence (sqflite works on Android out of the box; the ffi
  # loader below gives the same API on Windows/Linux/macOS desktop).
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Calendar UI + parsing of imported .ics files (CalDAV/Google/Outlook
  # exports) without requiring any cloud credentials to get started.
  table_calendar: ^3.1.2
  icalendar_parser: ^1.0.0

  # HTTP for the Ollama local API and (optionally) calendar provider APIs.
  http: ^1.2.1

  # Local settings (Ollama host/model, notification prefs, etc).
  shared_preferences: ^2.2.3

  # Budget charts.
  fl_chart: ^0.68.0

  # Date/number formatting.
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
